name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web App
        env:
          GEMINI_API_KEY: ${{ secrets.MY_GEMINI_API_KEY }}
        run: |
          npm run build

      - name: Add and Sync Capacitor Android
        env:
          GEMINI_API_KEY: ${{ secrets.MY_GEMINI_API_KEY }}
        run: |
          npx cap sync android

      - name: Setup Gradle Wrapper & Executable
        run: |
          chmod +x android/gradlew
          echo "Ensuring clean official Gradle Wrapper JAR..."
          mkdir -p android/gradle/wrapper
          curl -sSL "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar" -o android/gradle/wrapper/gradle-wrapper.jar
          java -jar android/gradle/wrapper/gradle-wrapper.jar --version

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
